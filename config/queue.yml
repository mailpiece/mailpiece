default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # A magic link waits on nothing, and a receiver that throttles holds up only its own delivery.
    - queues: [ "mailers" ]
      threads: 3
      processes: <%= Integer(ENV.fetch("MAIL_JOB_CONCURRENCY", 1)) %>
      polling_interval: 0.1
    - queues: [ "default", "backend", "solid_queue_recurring", "*" ]
      threads: 3
      processes: 1
      polling_interval: 0.25

development: *default
test: *default
production: *default
staging: *default
beta: *default
