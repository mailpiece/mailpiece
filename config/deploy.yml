service: mailpiece
image: mailpiece/mailpiece

# Keep previous version's fingerprinted assets so in-flight requests don't 404.
asset_path: /rails/public/assets

retain_containers: 1

registry:
  server: localhost:5555

builder:
  dockerfile: Dockerfile
  arch:
    - amd64
  local: <%= ENV.fetch("KAMAL_BUILDER_LOCAL", "true") %>

env:
  clear:
    MULTI_TENANT: false
    MAIL_DELIVERIES_PER_MINUTE: 30
    SMTP_AUTHENTICATION: plain
    SMTP_PORT: 587

  secret:
    - S3_ACCESS_KEY_ID
    - S3_ENDPOINT
    - S3_SECRET_ACCESS_KEY
    - SECRET_KEY_BASE
    - SMTP_PASSWORD
    - SMTP_USERNAME
    - SMTP_ADDRESS

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse bash
  logs: app logs -f
  storage: app exec "ls -la /rails/storage"
