service: mailpiece
image: mailpiece/mailpiece

# Keep previous version's fingerprinted assets so in-flight requests don't 404.
asset_path: /rails/public/assets

retain_containers: 1

registry:
  server: localhost:5555

builder:
  dockerfile: Dockerfile
  arch:
    - amd64
  local: <%= ENV.fetch("KAMAL_BUILDER_LOCAL", "true") %>

env:
  clear:
    MULTI_TENANT: false
    MAIL_DELIVERIES_PER_MINUTE: 30
    SMTP_AUTHENTICATION: plain
    SMTP_PORT: 587

  secret:
    - NEWSLETTER_MAIL_RELAY_TOKEN
    - NEWSLETTER_MAIL_RELAY_URL
    - NEWSLETTER_MAIL_TRANSPORT
    - S3_ACCESS_KEY_ID
    - S3_ENDPOINT
    - S3_SECRET_ACCESS_KEY
    - SECRET_KEY_BASE
    - SMTP_PASSWORD
    - SMTP_USERNAME
    - SMTP_ADDRESS

accessories:
  litestream:
    image: litestream/litestream:0.5.17
    roles:
      - web
    cmd: replicate
    files:
      - config/litestream.yml:/etc/litestream.yml
    options:
      # The uid that owns /rails/storage in the app's image.
      user: "1000:1000"
    env:
      secret:
        - LITESTREAM_ACCESS_KEY_ID
        - LITESTREAM_ENDPOINT
        - LITESTREAM_SECRET_ACCESS_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse bash
  logs: app logs -f
  restore-check: accessory exec litestream "restore -o /rails/storage/restored.sqlite3 /rails/storage/production.sqlite3"
  backups: accessory exec litestream "ltx -level all /rails/storage/production.sqlite3"
  storage: app exec "ls -la /rails/storage"
